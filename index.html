<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>View RAT</title>

  <!-- Open Graph Meta Tags for Discord, Telegram, and Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="View RAT" />
  <meta property="og:description" content="Here you can view a RAT." />
  <meta property="og:image" content="https://getrat.vercel.app/RAT.png" />
  <meta property="og:url" content="https://getrat.vercel.app/" />

  <!-- Twitter Card Meta Tags -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="View RAT" />
  <meta name="twitter:description" content="Here you can view a RAT." />
  <meta name="twitter:image" content="https://getrat.vercel.app/RAT.png" />
  <meta name="twitter:url" content="https://getrat.vercel.app/" />

  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      height: 100%;
      font-family: Arial, sans-serif;
      background-color: black;
    }

    #viewBtn, #downloadBtn, #droomerBtn {
      position: absolute;
      z-index: 2;
      padding: 15px 30px;
      font-size: 18px;
      border: none;
      cursor: pointer;
      border-radius: 10px;
      background-color: #555;
      color: white;
      text-decoration: none;
    }

    #viewBtn {
      top: 45%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    #droomerBtn {
      top: 58%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    #downloadBtn {
      display: none;
      bottom: 20px;
      right: 20px;
    }

    #bg {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      background-image: url('./RAT.png');
      background-size: cover;
      background-position: center;
      opacity: 0;
      transition: opacity 1.5s ease-in-out;
      z-index: 1;
    }
  </style>
</head>
<body>

  <div id="bg"></div>

  <button id="viewBtn">View RAT</button>
  <a href="/RAT.exe" id="downloadBtn" download>Download RAT</a>
  <button id="droomerBtn">Want no RAT? Get Droomer Now</button>

  <audio id="sfx" src="./sfx.mp3" preload="auto"></audio>

  <script>
    const viewBtn = document.getElementById('viewBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const droomerBtn = document.getElementById('droomerBtn');
    const bg = document.getElementById('bg');
    const sfx = document.getElementById('sfx');

    function goFullscreen() {
      const el = document.documentElement;
      if (el.requestFullscreen) el.requestFullscreen();
      else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
      else if (el.msRequestFullscreen) el.msRequestFullscreen();
    }

    viewBtn.addEventListener('click', () => {
      goFullscreen();
      bg.style.opacity = 1;
      sfx.play().catch(e => console.log("Sound error:", e));
      downloadBtn.style.display = 'block';
      viewBtn.style.display = 'none';
      droomerBtn.style.display = 'none';
    });

    droomerBtn.addEventListener('click', () => {
      window.location.href = "https://getrat.vercel.app/DroomerTeam";
    });
  </script>

</body>
</html>
