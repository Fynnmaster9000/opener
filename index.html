<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>View a BIG RAT</title>

  <!-- Vorschau (preview) for Discord, Twitter, etc. -->
  <meta property="og:title" content="View a BIG RAT">
  <meta property="og:description" content="Here you can view a BIG RAT.">
  <meta property="og:image" content="">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://getrat.vercel.app/"> <!-- Replace with your actual link -->

  <!-- Twitter preview (optional) -->
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="View a BIG RAT">
  <meta name="twitter:description" content="Here you can view a BIG RAT.">
  <meta name="twitter:image" content="">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      background-color: #000;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    #fullscreenButton {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 20px 40px;
      background: #222;
      color: white;
      font-size: 24px;
      border: none;
      cursor: pointer;
      border-radius: 10px;
      z-index: 2;
    }

    #ratImage {
      width: 100vw;
      height: 100vh;
      object-fit: fill;
      display: none;
    }
  </style>
</head>
<body>
  <button id="fullscreenButton">View RAT</button>
  <img src="RAT.png" alt="RAT Image" id="ratImage">

  <script>
    const button = document.getElementById('fullscreenButton');
    const image = document.getElementById('ratImage');

    button.addEventListener('click', () => {
      const elem = document.documentElement;

      if (elem.requestFullscreen) {
        elem.requestFullscreen();
      } else if (elem.webkitRequestFullscreen) {
        elem.webkitRequestFullscreen();
      } else if (elem.msRequestFullscreen) {
        elem.msRequestFullscreen();
      }

      button.style.display = 'none';
      image.style.display = 'block';
    });
  </script>
</body>
</html>
