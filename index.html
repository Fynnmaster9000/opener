<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>View a BIG RAT</title>

  <!-- Vorschau / Link Preview -->
  <meta property="og:title" content="View a BIG RAT">
  <meta property="og:description" content="Here you can view a BIG RAT.">
  <meta property="og:image" content="">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://getrat.vercel.app">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      background-color: #000;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    #fullscreenButton {
      position: absolute;
      left: 50%;
      top: 45%;
      transform: translateX(-50%);
      padding: 15px 30px;
      background: #222;
      color: white;
      font-size: 20px;
      border: none;
      cursor: pointer;
      border-radius: 10px;
      z-index: 3;
      transition: opacity 1s ease;
    }

    #downloadButton {
      position: fixed;
      bottom: 20px;
      right: 20px;
      padding: 12px 25px;
      background: #222;
      color: white;
      font-size: 18px;
      border: none;
      cursor: pointer;
      border-radius: 10px;
      z-index: 2;
      display: none;
      opacity: 0;
      transition: opacity 1.2s ease;
    }

    #downloadButton.show {
      display: block;
      opacity: 1;
    }

    #ratImage {
      width: 100vw;
      height: 100vh;
      object-fit: fill;
      opacity: 0;
      transition: opacity 2s ease;
      display: none;
    }

    #ratImage.show {
      display: block;
      opacity: 1;
    }

    #fadeOverlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: black;
      opacity: 0;
      z-index: 2;
      pointer-events: none;
      transition: opacity 1s ease;
    }

    #fadeOverlay.fade-in {
      opacity: 1;
    }

    #fadeOverlay.fade-out {
      opacity: 0;
    }
  </style>
</head>
<body>
  <button id="fullscreenButton">View RAT</button>

  <a href="RAT.exe" download>
    <button id="downloadButton">Download RAT</button>
  </a>

  <img src="RAT.png" alt="RAT Image" id="ratImage">
  <div id="fadeOverlay"></div>

  <audio id="dramaticSound" src="dramatic.mp3" preload="auto"></audio>

  <script>
    const viewBtn = document.getElementById('fullscreenButton');
    const downloadBtn = document.getElementById('downloadButton');
    const ratImg = document.getElementById('ratImage');
    const overlay = document.getElementById('fadeOverlay');
    const sound = document.getElementById('dramaticSound');

    viewBtn.addEventListener('click', () => {
      const elem = document.documentElement;

      if (elem.requestFullscreen) {
        elem.requestFullscreen();
      } else if (elem.webkitRequestFullscreen) {
        elem.webkitRequestFullscreen();
      } else if (elem.msRequestFullscreen) {
        elem.msRequestFullscreen();
      }

      viewBtn.style.opacity = '0';
      overlay.classList.add('fade-in');

      setTimeout(() => {
        viewBtn.style.display = 'none';
        ratImg.classList.add('show');
        overlay.classList.remove('fade-in');
        overlay.classList.add('fade-out');

        // Show download and play sound after slight delay
        setTimeout(() => {
          downloadBtn.classList.add('show');
          sound.play().catch(e => console.warn("Autoplay blocked:", e));
        }, 1000);
      }, 1000);
    });
  </script>
</body>
</html>
