<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>View a BIG RAT</title>

  <!-- Vorschau / Link Preview -->
  <meta property="og:title" content="View a BIG RAT">
  <meta property="og:description" content="Here you can view a BIG RAT.">
  <meta property="og:image" content="">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://getrat.vercel.app">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      background-color: #000;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    #fullscreenButton, #downloadButton {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      padding: 15px 30px;
      background: #222;
      color: white;
      font-size: 20px;
      border: none;
      cursor: pointer;
      border-radius: 10px;
      z-index: 2;
    }

    #fullscreenButton {
      top: 45%;
    }

    #downloadButton {
      top: 70%;
      display: none;
    }

    #ratImage {
      width: 100vw;
      height: 100vh;
      object-fit: fill;
      display: none;
    }
  </style>
</head>
<body>
  <button id="fullscreenButton">View RAT</button>
  <a href="RAT.png" download>
    <button id="downloadButton">Download RAT</button>
  </a>
  <img src="RAT.png" alt="RAT Image" id="ratImage">

  <script>
    const viewBtn = document.getElementById('fullscreenButton');
    const downloadBtn = document.getElementById('downloadButton');
    const ratImg = document.getElementById('ratImage');

    viewBtn.addEventListener('click', () => {
      const elem = document.documentElement;

      if (elem.requestFullscreen) {
        elem.requestFullscreen();
      } else if (elem.webkitRequestFullscreen) {
        elem.webkitRequestFullscreen();
      } else if (elem.msRequestFullscreen) {
        elem.msRequestFullscreen();
      }

      viewBtn.style.display = 'none';
      ratImg.style.display = 'block';
      downloadBtn.style.display = 'block';
    });
  </script>
</body>
</html>
